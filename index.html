<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>历史地图集 · 洛</title>
    <link rel="icon" type="image/svg+xml" href="res/favicon.svg" />

    <!-- ===== Leaflet CSS ===== -->
    <link rel="stylesheet" href="js/vendor/leaflet.css" />
    <!-- ===== Font Awesome 图标库 ===== -->
    <link rel="stylesheet" href="js/vendor/fontawesome-all.min.css" />

    <!-- ===== 自定义 CSS ===== -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ===== 顶部导航栏 ===== -->
    <header class="navbar">
        <!-- 品牌区：纯标题，不承载功能 -->
        <div class="navbar-brand">
            <div class="brand-icon">
                <img src="res/favicon.svg" alt="历史地图集" />
            </div>
            <div class="brand-text">
                <span class="brand-title">历史地图集</span>
            </div>
        </div>
        <div class="navbar-actions">
            <button type="button" class="nav-btn" id="toggleTheme" data-tooltip="切换主题" aria-label="切换主题">
                 <i class="fas fa-moon"></i>
            </button>
            <button type="button" class="nav-btn" id="toggleFullscreen" data-tooltip="切换全屏" aria-label="切换全屏">
                 <i class="fas fa-expand"></i>
            </button>
            <button type="button" class="nav-btn active" id="togglePanel" data-tooltip="切换图层面板" aria-label="切换图层面板">
                 <i class="fas fa-layer-group"></i>
            </button>
            <!-- 系统功能与作者入口之间的分隔标识 -->
            <span class="nav-divider" aria-hidden="true"></span>
            <!-- 作者入口：用户头像样式，独立于系统功能按钮 -->
            <button type="button" class="nav-btn user-avatar" id="aboutAuthor" data-tooltip="关于作者" aria-label="关于作者">洛</button>
        </div>
    </header>

    <!-- ===== 地图容器 ===== -->
    <div id="map"></div>

    <!-- ===== 现代化控制面板 ===== -->
    <div id="controlPanel" class="control-panel">
        <!-- 面板头部 -->
        <div class="panel-header">
            <div class="panel-header-title">
                <span class="panel-title-icon"><i class="fas fa-layer-group"></i></span>
                <div class="panel-title-text">
                    <h3>图层面板</h3>
                    <span class="panel-title-sub">管理地图图层与数据集</span>
                </div>
            </div>
            <div class="panel-header-actions">
                <div id="datasetAdd" class="dataset-select" data-tooltip="添加数据集到地图">
                    <button type="button" class="dataset-add-btn" aria-haspopup="dialog" aria-expanded="false">
                        <i class="fas fa-plus"></i>
                        <span>添加数据集</span>
                    </button>
                    <div class="dataset-select-menu" role="dialog" aria-label="选择要加载的数据集"></div>
                </div>
                <button type="button" class="panel-btn-icon" id="panelCollapse" aria-label="关闭图层面板" data-tooltip="关闭面板">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="panel-toolbar">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input
                    type="text"
                    id="layerSearch"
                    placeholder="搜索图层..."
                    class="search-input"
                />
                <button class="search-clear" id="searchClear" style="display:none;">
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>
            <div class="toolbar-actions">
                <button type="button" class="toolbar-btn" id="expandAllGroups" data-tooltip="展开所有数据集" aria-label="展开所有数据集">
                    <i class="fas fa-angles-down"></i>
                </button>
                <button type="button" class="toolbar-btn" id="collapseAllGroups" data-tooltip="折叠所有数据集" aria-label="折叠所有数据集">
                    <i class="fas fa-angles-up"></i>
                </button>
            </div>
        </div>

        <!-- 图层列表 -->
        <div id="layerList" class="layer-list-container">
            <!-- 由 JS 动态渲染 -->
        </div>

        <!-- 面板底部：数据集 / 图层 / 可见 三项合并统计 -->
        <div class="panel-footer">
            <div class="footer-stats">
                <span class="stat-item" data-tooltip="已加载数据集">
                    <i class="fas fa-database"></i><span id="statDatasets">0</span>
                </span>
                <span class="stat-sep">·</span>
                <span class="stat-item" data-tooltip="图层总数">
                    <i class="fas fa-layer-group"></i><span id="statLayers">0</span>
                </span>
                <span class="stat-sep">·</span>
                <span class="stat-item" data-tooltip="可见图层">
                    <i class="fas fa-eye"></i><span id="statVisible">0</span>
                </span>
            </div>
            <div class="footer-actions">
                <button type="button" class="footer-btn" id="selectAll" data-tooltip="显示所有图层" aria-label="显示所有图层">
                    <i class="fas fa-eye"></i>
                </button>
                <button type="button" class="footer-btn" id="deselectAll" data-tooltip="隐藏所有图层" aria-label="隐藏所有图层">
                    <i class="fas fa-eye-slash"></i>
                </button>
                <button type="button" class="footer-btn" id="zoomToAll" data-tooltip="缩放至全部可见图层" aria-label="缩放至全部可见图层">
                    <i class="fas fa-crosshairs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== Toast 通知 ===== -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- ===== 统一应用弹窗（确认 / 信息共用） ===== -->
    <div id="appModal" class="app-modal-overlay" hidden>
        <div class="app-modal" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
            <div class="app-modal-head">
                <span class="app-modal-icon"><i class="fas fa-circle-question"></i></span>
                <h4 class="app-modal-title" id="appModalTitle">提示</h4>
            </div>
            <div class="app-modal-body" id="appModalMessage"></div>
            <div class="app-modal-footer">
                <button type="button" class="modal-btn" id="appModalCancel">取消</button>
                <button type="button" class="modal-btn primary" id="appModalConfirm">确认</button>
            </div>
        </div>
    </div>

    <!-- ===== 图层样式配置弹窗 ===== -->
    <div id="styleModal" class="style-modal-overlay" hidden>
        <div class="style-modal" role="dialog" aria-modal="true" aria-labelledby="styleModalTitle">
            <div class="style-modal-header">
                <div class="style-modal-heading">
                    <span class="style-modal-icon"><i class="fas fa-palette"></i></span>
                    <div class="style-modal-head-text">
                        <h4 class="style-modal-title" id="styleModalTitle">图层样式</h4>
                        <span class="style-modal-sub" id="styleModalSub"></span>
                    </div>
                </div>
                <button type="button" class="panel-btn-icon" id="styleModalClose" aria-label="关闭样式设置" data-tooltip="关闭">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="style-modal-body" id="styleModalBody"></div>
            <div class="style-modal-footer">
                <button type="button" class="modal-btn" id="styleReset">
                    <i class="fas fa-undo-alt"></i> 恢复默认
                </button>
                <button type="button" class="modal-btn primary" id="styleModalDone">完成</button>
            </div>
        </div>
    </div>

    <!-- ===== 作者信息弹窗（导航栏品牌区点击打开） ===== -->
    <div id="authorModal" class="author-modal-overlay" hidden>
        <div class="author-modal" role="dialog" aria-modal="true" aria-labelledby="authorModalName">
            <button type="button" class="author-modal-close" id="authorModalClose" aria-label="关闭作者信息" data-tooltip="关闭">
                <i class="fas fa-times"></i>
            </button>
            <div class="author-modal-head">
                <div class="author-avatar" id="authorAvatar" aria-hidden="true">洛</div>
                <div class="author-modal-head-text">
                    <h4 class="author-modal-name" id="authorModalName">洛老师</h4>
                    <span class="author-modal-tagline" id="authorModalTagline"></span>
                </div>
            </div>
            <p class="author-modal-bio" id="authorModalBio"></p>
            <ul class="author-modal-details" id="authorModalDetails"></ul>
            <div class="author-modal-contacts" id="authorModalContacts"></div>
            <div class="author-modal-sponsor" id="authorModalSponsor">
                <div class="sponsor-title"><i class="fas fa-heart" aria-hidden="true"></i>友情赞助</div>
                <img src="res/zanzhu.jpg" alt="友情赞助二维码" class="sponsor-qr" />
                <p class="sponsor-desc">如果这个项目对你有帮助，欢迎扫码友情赞助支持</p>
            </div>
            <div class="author-modal-footer">
                <button type="button" class="modal-btn primary" id="authorModalOk">知道了</button>
            </div>
        </div>
    </div>

    <!-- ===== 第三方 JS（本地化，避免 CDN 失效导致地图/拖拽不可用） ===== -->
    <script src="js/vendor/leaflet.js"></script>
    <!-- ===== SortableJS 拖拽排序（本地副本，避免 CDN 加载失败导致拖拽失效） ===== -->
    <script src="js/vendor/Sortable.min.js"></script>

    <!-- ===== 自定义 JS ===== -->
    <script src="js/config.js"></script>
    <script src="js/measureTools.js"></script>
    <script src="js/dataScanner.js"></script> 
    <script src="js/mapManager.js"></script>
    <script src="js/layerManager.js"></script>
    <script src="js/uiManager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
