<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>历史地图集 · 洛</title>
    <link rel="icon" type="image/svg+xml" href="res/favicon.svg" />

    <!-- ===== Leaflet CSS ===== -->
    <link rel="stylesheet" href="js/vendor/leaflet.css?v=R159" />
    <!-- ===== Font Awesome 图标库 ===== -->
    <link rel="stylesheet" href="js/vendor/fontawesome-all.min.css?v=R159" />

    <!-- ===== 自定义 CSS（?v= 缓存穿透：每次改动升版本号，确保用户拿到最新样式） ===== -->
    <link rel="stylesheet" href="css/style.css?v=R159" />
</head>
<body>

    <!-- ===== 左侧边栏（参照 Copernicus Browser 全高侧边栏布局） ===== -->
    <aside id="sidebar" class="sidebar">
        <header class="sidebar-header">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <img src="res/favicon.svg" alt="历史地图集" />
                </div>
                <div class="brand-text">
                    <span class="brand-title">历史地图集</span>
                </div>
            </div>
            <div class="sidebar-header-actions">
                <button type="button" class="nav-btn" id="toggleTheme" data-tooltip="切换主题" aria-label="切换主题">
                    <i class="fas fa-moon"></i>
                </button>
                <button type="button" class="nav-btn" id="sidebarCollapse" data-tooltip="收起面板" aria-label="收起面板">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
        </header>

        <!-- ===== 图层面板（作为侧边栏主体） ===== -->
        <div id="controlPanel" class="sidebar-body">
        <!-- R127：顶部 Tab 在「数据集 / 图层」两视图间切换 -->
        <div class="panel-tabs" role="tablist" aria-label="面板视图">
            <button type="button" class="panel-tab is-active" data-view="datasets" role="tab" aria-selected="true"><i class="fas fa-database"></i> 数据集</button>
            <button type="button" class="panel-tab" data-view="layers" role="tab" aria-selected="false"><i class="fas fa-layer-group"></i> 图层</button>
        </div>

        <!-- 工具栏 -->
        <div class="panel-toolbar">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input
                    type="text"
                    id="layerSearch"
                    placeholder="搜索图层..."
                    class="search-input"
                />
                <button class="search-clear" id="searchClear" style="display:none;">
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>
            <div class="toolbar-actions" id="datasetBulkActions">
                <button type="button" class="dataset-bulk-btn" id="datasetAddAll" data-tooltip="添加全部数据集到图层" aria-label="添加全部数据集到图层"><i class="fas fa-plus"></i></button>
                <button type="button" class="dataset-bulk-btn danger" id="datasetRemoveAll" data-tooltip="移除全部已添加数据集" aria-label="移除全部已添加数据集"><i class="fas fa-minus"></i></button>
            </div>
            <div class="toolbar-actions" id="groupToggleActions">
                <button type="button" class="toolbar-btn" id="expandAllGroups" data-tooltip="展开所有数据集" aria-label="展开所有数据集">
                    <i class="fas fa-angles-down"></i>
                </button>
                <button type="button" class="toolbar-btn" id="collapseAllGroups" data-tooltip="折叠所有数据集" aria-label="折叠所有数据集">
                    <i class="fas fa-angles-up"></i>
                </button>
            </div>
        </div>

        <!-- R127：数据集视图（添加 / 移除数据集，含说明与图层构成） -->
        <div id="datasetView" class="view-pane">
            <div id="datasetList" class="dataset-list"></div>
        </div>

        <!-- 图层视图（原分组图层列表，R127 包裹进 view-pane） -->
        <div id="layerView" class="view-pane" hidden>
            <div id="layerList" class="layer-list-container"></div>
        </div>

        <!-- 底部操作条：统计（始终显示）+ 移除全部数据集（仅图层视图）+ 隐藏/显示所有数据集 + 缩放至全部可见图层（数据集/图层视图均显示） -->
        <div class="panel-footer">
            <div class="panel-stats" id="panelStats"></div>
            <div class="footer-actions" id="footerActions">
                <button type="button" class="footer-btn danger" id="footerRemoveAll" data-tooltip="移除全部已添加数据集" aria-label="移除全部已添加数据集" hidden>
                    <i class="fas fa-trash-can"></i>
                </button>
                <button type="button" class="footer-btn" id="datasetVisToggle" data-tooltip="隐藏所有数据集" aria-label="隐藏所有数据集">
                    <i class="fas fa-eye-slash"></i>
                </button>
                <button type="button" class="footer-btn" id="zoomToAll" data-tooltip="缩放至全部可见图层" aria-label="缩放至全部可见图层">
                    <i class="fas fa-crosshairs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 底部：关于 入口 + 版本号（v0.2.0 为当前大版本） -->
    <footer class="sidebar-footer">
        <button type="button" class="sidebar-footer-btn" id="aboutAuthorBtn" data-tooltip="关于 洛老师">
            <i class="fas fa-circle-info"></i>
            <span>关于</span>
        </button>
        <span class="sidebar-footer-version">v0.2.0</span>
    </footer>

    </aside>

    <!-- 侧边栏宽度拖拽调节手柄（桌面端，右缘；置于 sidebar 之外，避免被圆角 overflow 裁剪） -->
    <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-label="拖动调节面板宽度" aria-orientation="vertical" title="拖动调节面板宽度"></div>

<!-- 移动端侧边栏抽屉遮罩 -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ===== 地图区域（含地图、搜索框、右工具栏） ===== -->
<div class="map-area">
    <div id="map"></div>

    <!-- 地图左上角浮动按钮：面板收起时作为唯一可见入口，点击展开面板（位于左上方） -->
    <button type="button" class="map-fab" id="layerFab" data-tooltip="展开面板" aria-label="展开面板" aria-expanded="true"><i class="fas fa-chevron-right"></i></button>

    <!-- 地图右侧垂直工具栏（测量 / 定位 / 全屏） -->
    <div class="map-tools" id="mapTools" role="group" aria-label="地图工具">
        <button type="button" class="map-tool-btn measure-btn" data-tool="distance" data-tooltip="测距" aria-label="测距"><i class="fas fa-ruler-combined"></i></button>
        <button type="button" class="map-tool-btn measure-btn" data-tool="area" data-tooltip="测面积" aria-label="测面积"><i class="fas fa-draw-polygon"></i></button>
        <button type="button" class="map-tool-btn measure-btn" data-tool="clear" data-tooltip="清除测量" aria-label="清除测量"><i class="fas fa-eraser"></i></button>
        <div class="tool-sep" aria-hidden="true"></div>
        <button type="button" class="map-tool-btn" id="mapToolLocate" data-tooltip="定位到我的位置" aria-label="定位到我的位置"><i class="fas fa-location-arrow"></i></button>
        <button type="button" class="map-tool-btn" id="toggleFullscreen" data-tooltip="切换全屏" aria-label="切换全屏"><i class="fas fa-expand"></i></button>
    </div>
    <!-- 底图切换下拉菜单（由 JS 定位到按钮下方） -->
    <div class="base-layer-tool-menu" id="baseLayerToolMenu" role="menu" aria-label="底图选择"></div>

    <!-- R106：独立「地点搜索」——图标按钮置于右侧工具栏左侧，点击展开搜索框 -->
    <div class="place-search-floating" id="placeSearchFloating">
        <div class="place-search-input-wrap">
            <input
                type="text"
                id="placeSearchInput"
                class="place-search-input"
                placeholder="搜索地点..."
                autocomplete="off"
                aria-label="搜索地点"
            />
            <button type="button" class="place-search-clear" id="placeSearchClear" style="display:none;" aria-label="清除">
                <i class="fas fa-times-circle"></i>
            </button>
            <div class="place-search-results" id="placeSearchResultsTop" role="listbox" aria-label="地点搜索结果"></div>
        </div>
        <button type="button" class="place-search-icon-btn" id="placeSearchToggle" aria-label="搜索地点" aria-expanded="false">
            <i class="fas fa-search"></i>
        </button>
        <!-- R108：底图切换图标使用独立类，避免搜索展开时误染 active 态 -->
        <button type="button" class="map-tool-icon-btn" id="basemapToggle" aria-label="切换底图" aria-haspopup="menu" aria-expanded="false">
            <i class="fas fa-map"></i>
        </button>
    </div>
</div>

<!-- ===== Toast 通知 ===== -->
<div id="toastContainer" class="toast-container"></div>

<!-- ===== 数据集加载中遮罩 ===== -->
<div id="globalLoading" class="global-loading" hidden>
    <div class="loading-spinner" aria-hidden="true"></div>
    <div class="loading-text" id="globalLoadingText">正在加载数据集…</div>
</div>

    <!-- ===== 统一应用弹窗（确认 / 信息共用） ===== -->
    <div id="appModal" class="app-modal-overlay" hidden>
        <div class="app-modal" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
            <div class="app-modal-head">
                <span class="app-modal-icon"><i class="fas fa-circle-question"></i></span>
                <h4 class="app-modal-title" id="appModalTitle">提示</h4>
            </div>
            <div class="app-modal-body" id="appModalMessage"></div>
            <div class="app-modal-footer">
                <button type="button" class="modal-btn" id="appModalCancel">取消</button>
                <button type="button" class="modal-btn primary" id="appModalConfirm">确认</button>
            </div>
        </div>
    </div>

    <!-- ===== 图层样式配置弹窗 ===== -->
    <div id="styleModal" class="style-modal-overlay" hidden>
        <div class="style-modal" role="dialog" aria-modal="true" aria-labelledby="styleModalTitle">
            <div class="style-modal-header">
                <div class="style-modal-heading">
                    <span class="style-modal-icon"><i class="fas fa-palette"></i></span>
                    <div class="style-modal-head-text">
                        <h4 class="style-modal-title" id="styleModalTitle">图层样式</h4>
                        <span class="style-modal-sub" id="styleModalSub"></span>
                    </div>
                </div>
                <button type="button" class="panel-btn-icon" id="styleModalClose" aria-label="关闭样式设置" data-tooltip="关闭">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="style-modal-body" id="styleModalBody"></div>
            <div class="style-modal-footer">
                <button type="button" class="modal-btn" id="styleReset">
                    <i class="fas fa-undo-alt"></i> 恢复默认
                </button>
                <button type="button" class="modal-btn primary" id="styleModalDone">完成</button>
            </div>
        </div>
    </div>

    <!-- ===== 标注设置弹窗（R106：字段 / 文字色 / 扫边 / 字体） ===== -->
    <div id="labelSettingsModal" class="style-modal-overlay" hidden>
        <div class="style-modal" role="dialog" aria-modal="true" aria-labelledby="labelSettingsTitle">
            <div class="style-modal-header">
                <div class="style-modal-heading">
                    <span class="style-modal-icon"><i class="fas fa-font"></i></span>
                    <div class="style-modal-head-text">
                        <h4 class="style-modal-title" id="labelSettingsTitle">标注设置</h4>
                        <span class="style-modal-sub" id="labelSettingsSub">调整标注字段、文字颜色、扫边与字体</span>
                    </div>
                </div>
                <button type="button" class="panel-btn-icon" id="labelSettingsClose" aria-label="关闭标注设置" data-tooltip="关闭">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="style-modal-body" id="labelSettingsBody"></div>
            <div class="style-modal-footer">
                <button type="button" class="modal-btn" id="labelSettingsReset">
                    <i class="fas fa-undo-alt"></i> 恢复默认
                </button>
                <button type="button" class="modal-btn primary" id="labelSettingsDone">完成</button>
            </div>
        </div>
    </div>

    <!-- ===== 作者信息弹窗（导航栏品牌区点击打开） ===== -->
    <div id="authorModal" class="author-modal-overlay" hidden>
        <div class="author-modal" role="dialog" aria-modal="true" aria-labelledby="authorModalName">
            <button type="button" class="author-modal-close" id="authorModalClose" aria-label="关闭作者信息" data-tooltip="关闭">
                <i class="fas fa-times"></i>
            </button>
            <div class="author-modal-head">
                <div class="author-avatar" id="authorAvatar" aria-hidden="true">洛</div>
                <div class="author-modal-head-text">
                    <h4 class="author-modal-name" id="authorModalName">洛老师</h4>
                    <span class="author-modal-tagline" id="authorModalTagline"></span>
                </div>
            </div>
            <div class="author-modal-body">
                <div class="author-columns">
                    <div class="author-col-title area-t1"><i class="fas fa-user-pen" aria-hidden="true"></i>关于作者</div>
                    <div class="author-col-title area-t2"><i class="fas fa-globe" aria-hidden="true"></i>关于项目</div>
                    <p class="author-modal-bio area-b1" id="authorModalBio"></p>
                    <p class="website-text area-b2" id="authorModalWebsite"></p>
                    <div class="author-modal-contacts area-c1" id="authorModalContactAuthor"></div>
                    <div class="author-modal-contacts area-c2" id="authorModalContactProject"></div>
                    <div class="author-modal-sponsor area-s1" id="authorModalSponsor">
                        <div class="sponsor-title"><i class="fas fa-heart" aria-hidden="true"></i>友情赞助</div>
                        <img src="res/zanzhu.jpg" alt="友情赞助二维码" class="sponsor-qr" />
                        <p class="sponsor-desc">喜欢的话，扫码支持一下作者吧</p>
                    </div>
                    <ul class="author-modal-details area-d1" id="authorModalDetails"></ul>
                </div>
            </div>
            <div class="author-modal-footer">
                <button type="button" class="modal-btn primary" id="authorModalOk">知道了</button>
            </div>
        </div>
    </div>

    <!-- ===== 第三方 JS（本地化，避免 CDN 失效导致地图/拖拽不可用） ===== -->
    <script src="js/vendor/leaflet.js?v=R159"></script>
    <!-- ===== SortableJS 拖拽排序（本地副本，避免 CDN 加载失败导致拖拽失效） ===== -->
    <script src="js/vendor/Sortable.min.js?v=R159"></script>

    <!-- ===== 自定义 JS ===== -->
    <script src="js/config.js?v=R159"></script>
    <script src="js/measureTools.js?v=R159"></script>
    <script src="js/dataScanner.js?v=R159"></script> 
    <script src="js/mapManager.js?v=R159"></script>
    <script src="js/layerManager.js?v=R159"></script>
    <script src="js/uiManager.js?v=R159"></script>
    <script src="js/main.js?v=R159"></script>
</body>
</html>
