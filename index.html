<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>洛老师的历史地图集</title>

    <!-- ===== Leaflet CSS ===== -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- ===== Font Awesome 图标库 ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- ===== 自定义 CSS ===== -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ===== 顶部导航栏 ===== -->
    <header class="navbar">
        <div class="navbar-brand">
            <div class="brand-icon">
                <i class="fas fa-map-marked-alt"></i>
            </div>
            <div class="brand-text">
                <span class="brand-title">洛老师的历史地图集</span>
            </div>
        </div>
        <div class="navbar-actions">
            <button type="button" class="nav-btn" id="toggleTheme" data-tooltip="切换主题" aria-label="切换主题">
                 <i class="fas fa-moon"></i>
            </button>
            <button type="button" class="nav-btn" id="toggleFullscreen" data-tooltip="切换全屏" aria-label="切换全屏">
                 <i class="fas fa-expand"></i>
            </button>
            <button type="button" class="nav-btn active" id="togglePanel" data-tooltip="切换图层面板" aria-label="切换图层面板">
                 <i class="fas fa-layer-group"></i>
            </button>
        </div>
    </header>

    <!-- ===== 地图容器 ===== -->
    <div id="map"></div>

    <!-- ===== 现代化控制面板 ===== -->
    <div id="controlPanel" class="control-panel">
        <!-- 面板头部 -->
        <div class="panel-header">
            <div class="panel-header-left">
                <h3><i class="fas fa-layer-group"></i> 数据集</h3>
                <div id="datasetSelect" class="dataset-select" data-tooltip="选择数据集">
                    <button type="button" class="dataset-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                        <span class="dataset-select-value">选择数据集</span><i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="dataset-select-menu" role="listbox"></div>
                </div>
            </div>
            <div class="panel-header-actions">
                <button type="button" class="panel-btn-icon" id="panelCollapse" aria-label="关闭图层面板" data-tooltip="关闭面板">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="panel-toolbar">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input 
                    type="text" 
                    id="layerSearch" 
                    placeholder="搜索图层..." 
                    class="search-input"
                />
                <button class="search-clear" id="searchClear" style="display:none;">
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>
            <div class="toolbar-actions">
                <button type="button" class="toolbar-btn" id="selectAll" data-tooltip="显示全部图层" aria-label="显示全部图层">
                    <i class="fas fa-check-double"></i>
                </button>
                <button type="button" class="toolbar-btn" id="deselectAll" data-tooltip="隐藏全部图层" aria-label="隐藏全部图层">
                    <i class="fas fa-square"></i>
                </button>
            </div>
        </div>

        <!-- 图层列表 -->
        <div id="layerList" class="layer-list-container">
            <!-- 由 JS 动态渲染 -->
        </div>

        <!-- 面板底部 -->
        <div class="panel-footer">
            <div class="footer-stats">
                <span class="stat-item">
                    <i class="fas fa-layer-group"></i>
                    <span id="datasetLayerCount">0</span> 个图层
                </span>
                <span class="stat-divider">|</span>
                <span class="stat-item">
                    <i class="fas fa-database"></i>
                    <span id="footerTotal">0</span> 个要素
                </span>
                <span class="stat-divider">|</span>
                <span class="stat-item">
                    <i class="fas fa-eye"></i>
                    <span id="footerVisible">0</span> 可见
                </span>
            </div>
            <div class="footer-actions">
                <button type="button" class="footer-btn" id="zoomToAll" data-tooltip="缩放至全部" aria-label="缩放至全部图层">
                    <i class="fas fa-crosshairs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== 右下角统计信息 ===== -->
    <div id="statsBar" class="stats-bar">
        <span class="stat-item">
            <i class="fas fa-database"></i>
            <span id="statsTotal">0</span>
        </span>
        <span class="stat-divider">·</span>
        <span class="stat-item">
            <i class="fas fa-eye"></i>
            <span id="statsVisible">0</span>
        </span>
        <span class="stat-divider">·</span>
        <span class="stat-item">
            <i class="fas fa-layer-group"></i>
            <span id="statsLayers">0</span>
        </span>
    </div>

    <!-- ===== Toast 通知 ===== -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- ===== 第三方 JS ===== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- ===== SortableJS 拖拽排序 ===== -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <!-- ===== 自定义 JS ===== -->
    <script src="js/config.js"></script>
    <script src="js/dataScanner.js"></script> 
    <script src="js/mapManager.js"></script>
    <script src="js/layerManager.js"></script>
    <script src="js/uiManager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
